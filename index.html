<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeringkas Teks TextRank</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-decoration">
        <div class="glow-circle circle-1"></div>
        <div class="glow-circle circle-2"></div>
    </div>

    <div class="main-card">
        <!-- Header -->
        <header class="card-header">
            <div class="header-icon">
                <i data-lucide="sparkles"></i>
            </div>
            <div class="header-title">
                <h1>Pemeringkas Teks (TextRank)</h1>
                <p>Antarmuka pemeringkas otomatis dengan slider 10% - 50% &amp; batas 500 kata</p>
            </div>
        </header>

        <!-- Form Pemeringkas -->
        <form id="summarizerForm" onsubmit="return false;" class="card-body">
            <!-- Area Input Teks -->
            <div class="form-group">
                <div class="label-row">
                    <label for="inputText">
                        <i data-lucide="file-text"></i> Teks Asli
                    </label>
                    <span id="wordCountBadge" class="badge">
                        <i data-lucide="file-type"></i> <span id="wordCountText">0 / 500 kata</span>
                    </span>
                </div>
                <div class="textarea-wrapper">
                    <textarea 
                        id="inputText" 
                        rows="7" 
                        placeholder="Ketik atau tempel teks di sini (Maksimal 500 kata)..."
                    ></textarea>
                    <button type="button" id="btnClear" class="btn-clear" title="Hapus Teks">
                        <i data-lucide="rotate-ccw"></i> Reset
                    </button>
                </div>
            </div>

            <!-- Slider Persentase Ringkasan -->
            <div class="form-group slider-group">
                <div class="label-row">
                    <label for="ratioSlider">
                        <i data-lucide="sliders"></i> Rasio Ringkasan:
                    </label>
                    <span id="ratioDisplay" class="ratio-badge">30%</span>
                </div>
                <div class="slider-container">
                    <span class="limit-label">10%</span>
                    <input type="range" id="ratioSlider" min="10" max="50" value="30" step="5">
                    <span class="limit-label">50%</span>
                </div>
            </div>

            <!-- Tombol Ringkas -->
            <button type="submit" id="btnRingkas" class="btn-primary">
                <i data-lucide="zap"></i> Ringkas Teks
            </button>
        </form>

        <!-- Area Hasil Ringkasan -->
        <div class="card-footer output-section">
            <div class="label-row">
                <label for="outputText">
                    <i data-lucide="align-left"></i> Hasil Ringkasan
                </label>
                <button type="button" id="btnCopy" class="btn-copy">
                    <i data-lucide="copy"></i> Salin
                </button>
            </div>
            <textarea 
                id="outputText" 
                rows="6" 
                readonly 
                placeholder="Hasil ringkasan teks akan muncul di sini..."
            ></textarea>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <i data-lucide="check-circle"></i>
        <span id="toastMsg">Teks berhasil disalin!</span>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
